[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dualflow"
version = "0.1.0"
description = "Agent-to-Agent 권한 위임 검증 프레임워크 — Authority Flow × Semantic Flow → Joint Verification"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["multi-agent", "delegation", "capability", "entropy", "clarification", "llm-agents"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dualflow-demo = "dualflow.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dualflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
